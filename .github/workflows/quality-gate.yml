name: Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, master, develop, production]
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
    inputs:
      regenerate_visual_baselines:
        description: Regenerate Linux visual baselines and upload them as an artifact
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TEST_ENV: ci

jobs:
  lint:
    name: Lint (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  compile:
    name: Compile (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Prepare CI environment
        run: cp .env.ci.example .env.ci
      - run: npm ci
      - run: npm run build:ci
      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiled-app
          path: dist/
          if-no-files-found: ignore

  unit-tests:
    name: Unit tests (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run component tests
        run: |
          mkdir -p reports
          npx vitest run tests/components --outputFile=reports/unit-tests.xml
      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: reports/unit-tests.xml
          if-no-files-found: ignore
      - name: Upload Allure raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ github.job }}
          path: allure-results/
          if-no-files-found: ignore

  integration-tests:
    name: Integration tests (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run integration tests
        run: |
          mkdir -p reports
          npx vitest run tests/integration --outputFile=reports/integration-tests.xml
      - name: Upload integration test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-report
          path: reports/integration-tests.xml
          if-no-files-found: ignore
      - name: Upload Allure raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ github.job }}
          path: allure-results/
          if-no-files-found: ignore

  agent-tests:
    name: Python agent tests (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install project dependencies
        run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - name: Install agent dependencies
        run: python -m pip install -r agent/requirements.txt
      - name: Run agent tests
        run: python -m unittest agent.test_orchestrator

  api-tests:
    name: API contract tests (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Prepare CI environment
        run: cp .env.ci.example .env.ci
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run API tests
        run: |
          set -o pipefail
          mkdir -p diagnostics
          npm run test:api 2>&1 | tee diagnostics/api.log
      - name: Upload API reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-reports
          path: |
            playwright-report/
            test-results/
            diagnostics/
          if-no-files-found: ignore
      - name: Upload Allure raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ github.job }}
          path: allure-results/
          if-no-files-found: ignore

  functional-tests:
    name: Functional tests (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Prepare CI environment
        run: cp .env.ci.example .env.ci
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run functional tests
        run: |
          set -o pipefail
          mkdir -p diagnostics
          npm run test:functional 2>&1 | tee diagnostics/functional.log
      - name: Upload functional reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functional-reports
          path: |
            playwright-report/
            test-results/
            diagnostics/
          if-no-files-found: ignore
      - name: Upload Allure raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ github.job }}
          path: allure-results/
          if-no-files-found: ignore

  accessibility-tests:
    name: Accessibility tests (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Prepare CI environment
        run: cp .env.ci.example .env.ci
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run accessibility tests
        run: |
          set -o pipefail
          mkdir -p diagnostics
          npm run test:accessibility 2>&1 | tee diagnostics/accessibility.log
      - name: Upload accessibility reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-reports
          path: |
            playwright-report/
            test-results/
            diagnostics/
          if-no-files-found: ignore
      - name: Upload Allure raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ github.job }}
          path: allure-results/
          if-no-files-found: ignore

  security-tests:
    name: Application security tests (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Prepare CI environment
        run: cp .env.ci.example .env.ci
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run application security tests
        run: |
          set -o pipefail
          mkdir -p diagnostics
          npm run test:security 2>&1 | tee diagnostics/security.log
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            playwright-report/
            test-results/
            diagnostics/
          if-no-files-found: ignore
      - name: Upload Allure raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ github.job }}
          path: allure-results/
          if-no-files-found: ignore

  ai-playwright-diagnosis:
    name: AI Playwright diagnosis (informational)
    if: ${{ !cancelled() && (needs.api-tests.result == 'failure' || needs.functional-tests.result == 'failure' || needs.accessibility-tests.result == 'failure' || needs.security-tests.result == 'failure') }}
    needs: [api-tests, functional-tests, accessibility-tests, security-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    permissions:
      contents: read
    services:
      ollama:
        image: ollama/ollama:0.6.8
        ports:
          - 11434:11434
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download Playwright reports
        uses: actions/download-artifact@v4
        with:
          pattern: "*-reports"
          path: diagnostic-input
      - name: Download local model
        run: |
          set -o pipefail
          curl --fail --silent --show-error --retry 20 --retry-connrefused \
            --retry-delay 2 --retry-max-time 60 http://127.0.0.1:11434/api/version
          curl --fail --silent --show-error --max-time 600 \
            http://127.0.0.1:11434/api/pull \
            -d '{"model":"qwen2.5:1.5b","stream":false}' | jq -e '.status == "success"'
      - name: Diagnose failed Playwright jobs
        env:
          API_RESULT: ${{ needs.api-tests.result }}
          FUNCTIONAL_RESULT: ${{ needs.functional-tests.result }}
          ACCESSIBILITY_RESULT: ${{ needs.accessibility-tests.result }}
          SECURITY_RESULT: ${{ needs.security-tests.result }}
        run: |
          failed=()
          for suite in api functional accessibility security; do
            variable="${suite^^}_RESULT"
            if [ "${!variable}" = "failure" ]; then failed+=("$suite"); fi
          done
          export FAILED_SUITES="$(IFS=,; echo "${failed[*]}")"
          node scripts/diagnose-playwright.js
          cat ai-diagnosis.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload AI diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-playwright-diagnosis
          path: ai-diagnosis.md
          if-no-files-found: warn

  dependency-audit:
    name: High-severity dependency audit (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit dependencies
        run: |
          mkdir -p reports
          npm audit --audit-level=high --json > reports/npm-audit.json
      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-report
          path: reports/npm-audit.json
          if-no-files-found: ignore

  secret-scan:
    name: Secret scanning (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL static analysis (blocking)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3

  dependency-review:
    name: Pull request dependency review (blocking)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  performance-smoke:
    name: Performance smoke (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Prepare CI environment
        run: cp .env.ci.example .env.ci
      - run: npm ci
      - uses: grafana/setup-k6-action@v1
      - name: Start local test service
        shell: bash
        run: |
          mkdir -p reports
          set -a
          source .env.ci
          set +a
          export BASE_URL="$VITE_APP_URL"
          npm run dev:ci > vite.log 2>&1 &
          server_pid=$!
          for attempt in {1..30}; do
            if curl --fail --silent "$BASE_URL/api/health" > /dev/null; then exit 0; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then cat vite.log; exit 1; fi
            sleep 1
          done
          cat vite.log
          exit 1
      - name: Run k6 smoke test
        run: k6 run --summary-export=reports/k6-smoke-summary.json --env BASE_URL="$(grep '^VITE_APP_URL=' .env.ci | cut -d= -f2-)" tests/performance/health-smoke.js
      - name: Upload performance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-smoke-reports
          path: |
            reports/k6-smoke-summary.json
            vite.log
          if-no-files-found: ignore

  visual-regression:
    name: Visual regression (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Prepare CI environment
        run: cp .env.ci.example .env.ci
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - run: npm run test:visual
      - name: Upload visual reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-reports
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
      - name: Upload Allure raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ github.job }}
          path: allure-results/
          if-no-files-found: ignore

  load-tests:
    name: Load tests (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Prepare CI environment
        run: cp .env.ci.example .env.ci
      - run: npm ci
      - uses: grafana/setup-k6-action@v1
      - name: Start local test service
        shell: bash
        run: |
          mkdir -p reports
          set -a
          source .env.ci
          set +a
          export BASE_URL="$VITE_APP_URL"
          npm run dev:ci > vite.log 2>&1 &
          server_pid=$!
          for attempt in {1..30}; do
            if curl --fail --silent "$BASE_URL/api/health" > /dev/null; then exit 0; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then cat vite.log; exit 1; fi
            sleep 1
          done
          cat vite.log
          exit 1
      - name: Run k6 load test
        run: k6 run --summary-export=reports/k6-load-summary.json --env BASE_URL="$(grep '^VITE_APP_URL=' .env.ci | cut -d= -f2-)" tests/performance/health.js
      - name: Upload load test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-reports
          path: |
            reports/k6-load-summary.json
            vite.log
          if-no-files-found: ignore

  cross-browser-tests:
    name: Cross-browser tests (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Prepare CI environment
        run: cp .env.ci.example .env.ci
      - run: npm ci
      - run: npx playwright install --with-deps firefox webkit
      - run: npx playwright test tests/e2e/currency-conversion.spec.js --project=firefox --project=webkit
      - name: Upload cross-browser reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-browser-reports
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
      - name: Upload Allure raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ github.job }}
          path: allure-results/
          if-no-files-found: ignore

  regenerate-visual-baselines:
    name: Regenerate Linux visual baselines (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.regenerate_visual_baselines
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Prepare CI environment
        run: cp .env.ci.example .env.ci
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:visual:update
      - name: Upload regenerated baselines for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-linux-visual-baselines
          path: tests/visual/visual-regression.spec.js-snapshots/*-linux.png
          if-no-files-found: error
      - name: Upload Allure raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ github.job }}
          path: allure-results/
          if-no-files-found: ignore

  allure-report:
    name: Allure report (informational)
    if: always()
    continue-on-error: true
    needs:
      - unit-tests
      - integration-tests
      - agent-tests
      - api-tests
      - functional-tests
      - accessibility-tests
      - security-tests
      - visual-regression
      - cross-browser-tests
      - regenerate-visual-baselines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - name: Download Allure raw results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true
      - name: Restore history from the published report
        shell: bash
        env:
          ALLURE_PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          mkdir -p allure-results/history
          for file in history.json history-trend.json duration-trend.json retry-trend.json categories-trend.json; do
            target="allure-results/history/$file"
            if curl --fail --silent --location "$ALLURE_PAGES_URL/history/$file" --output "$target.tmp"; then
              mv "$target.tmp" "$target"
            else
              rm -f "$target.tmp"
            fi
          done
      - name: Generate Allure HTML report
        run: npm run allure:generate
      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          if-no-files-found: ignore

  publish-allure-pages:
    name: Publish Allure report to GitHub Pages (informational)
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: allure-report
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download Allure HTML report
        uses: actions/download-artifact@v4
        with:
          name: allure-report
          path: allure-report
      - uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  quality-gate:
    name: quality-gate
    if: always()
    runs-on: ubuntu-latest
    needs:
      - lint
      - compile
      - unit-tests
      - integration-tests
      - api-tests
      - functional-tests
      - accessibility-tests
      - security-tests
      - codeql
      - dependency-review
    steps:
      - name: Require every blocking check to pass
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          COMPILE_RESULT: ${{ needs.compile.result }}
          UNIT_RESULT: ${{ needs.unit-tests.result }}
          INTEGRATION_RESULT: ${{ needs.integration-tests.result }}
          AGENT_RESULT: ${{ needs.agent-tests.result }}
          API_RESULT: ${{ needs.api-tests.result }}
          FUNCTIONAL_RESULT: ${{ needs.functional-tests.result }}
          ACCESSIBILITY_RESULT: ${{ needs.accessibility-tests.result }}
          SECURITY_RESULT: ${{ needs.security-tests.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          IS_PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
        run: |
          for check in "lint=$LINT_RESULT" "compile=$COMPILE_RESULT" "unit-tests=$UNIT_RESULT" "integration-tests=$INTEGRATION_RESULT" "agent-tests=$AGENT_RESULT" "api-tests=$API_RESULT" "functional-tests=$FUNCTIONAL_RESULT" "accessibility-tests=$ACCESSIBILITY_RESULT" "security-tests=$SECURITY_RESULT" "codeql=$CODEQL_RESULT"; do
            name="${check%%=*}"
            result="${check#*=}"
            if [ "$result" != "success" ]; then
              echo "::error::Required check '$name' did not pass (result: $result)."
              exit 1
            fi
          done
          if [ "$IS_PULL_REQUEST" = "true" ] && [ "$DEPENDENCY_REVIEW_RESULT" != "success" ]; then
            echo "Dependency review did not succeed: $DEPENDENCY_REVIEW_RESULT"
            exit 1
          fi
          if [ "$IS_PULL_REQUEST" != "true" ] && [ "$DEPENDENCY_REVIEW_RESULT" != "skipped" ] && [ "$DEPENDENCY_REVIEW_RESULT" != "success" ]; then
            echo "Dependency review has an unexpected result: $DEPENDENCY_REVIEW_RESULT"
            exit 1
          fi
          echo "All required quality checks passed."
