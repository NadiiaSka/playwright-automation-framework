name: Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, master, develop, production]
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
    inputs:
      regenerate_visual_baselines:
        description: Regenerate Linux visual baselines and upload them as an artifact
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TEST_ENV: ci

jobs:
  lint:
    name: Lint (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  compile:
    name: Compile (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Prepare CI environment
        run: cp .env.ci.example .env.ci
      - run: npm ci
      - run: npm run build:ci
      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiled-app
          path: dist/
          if-no-files-found: ignore

  unit-tests:
    name: Unit tests (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run component tests
        run: |
          mkdir -p reports
          npx vitest run tests/components --reporter=junit --outputFile=reports/unit-tests.xml
      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: reports/unit-tests.xml
          if-no-files-found: ignore

  integration-tests:
    name: Integration tests (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run integration tests
        run: |
          mkdir -p reports
          npx vitest run tests/integration --reporter=junit --outputFile=reports/integration-tests.xml
      - name: Upload integration test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-report
          path: reports/integration-tests.xml
          if-no-files-found: ignore

  api-tests:
    name: API contract tests (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Prepare CI environment
        run: cp .env.ci.example .env.ci
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run API tests
        run: npm run test:api
      - name: Upload API reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-reports
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  functional-tests:
    name: Functional tests (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Prepare CI environment
        run: cp .env.ci.example .env.ci
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - run: npm run test:functional
      - name: Upload functional reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functional-reports
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  accessibility-tests:
    name: Accessibility tests (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Prepare CI environment
        run: cp .env.ci.example .env.ci
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - run: npm run test:accessibility
      - name: Upload accessibility reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-reports
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  security-tests:
    name: Application security tests (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Prepare CI environment
        run: cp .env.ci.example .env.ci
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run application security tests
        run: npm run test:security
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  dependency-audit:
    name: High-severity dependency audit (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit dependencies
        run: |
          mkdir -p reports
          npm audit --audit-level=high --json > reports/npm-audit.json
      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-report
          path: reports/npm-audit.json
          if-no-files-found: ignore

  secret-scan:
    name: Secret scanning (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL static analysis (blocking)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3

  dependency-review:
    name: Pull request dependency review (blocking)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  performance-smoke:
    name: Performance smoke (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Prepare CI environment
        run: cp .env.ci.example .env.ci
      - run: npm ci
      - uses: grafana/setup-k6-action@v1
      - name: Start local test service
        shell: bash
        run: |
          mkdir -p reports
          set -a
          source .env.ci
          set +a
          export BASE_URL="$VITE_APP_URL"
          npm run dev:ci > vite.log 2>&1 &
          server_pid=$!
          for attempt in {1..30}; do
            if curl --fail --silent "$BASE_URL/api/health" > /dev/null; then exit 0; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then cat vite.log; exit 1; fi
            sleep 1
          done
          cat vite.log
          exit 1
      - name: Run k6 smoke test
        run: k6 run --summary-export=reports/k6-smoke-summary.json --env BASE_URL="$(grep '^VITE_APP_URL=' .env.ci | cut -d= -f2-)" tests/performance/health-smoke.js
      - name: Upload performance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-smoke-reports
          path: |
            reports/k6-smoke-summary.json
            vite.log
          if-no-files-found: ignore

  visual-regression:
    name: Visual regression (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Prepare CI environment
        run: cp .env.ci.example .env.ci
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - run: npm run test:visual
      - name: Upload visual reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-reports
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  load-tests:
    name: Load tests (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Prepare CI environment
        run: cp .env.ci.example .env.ci
      - run: npm ci
      - uses: grafana/setup-k6-action@v1
      - name: Start local test service
        shell: bash
        run: |
          mkdir -p reports
          set -a
          source .env.ci
          set +a
          export BASE_URL="$VITE_APP_URL"
          npm run dev:ci > vite.log 2>&1 &
          server_pid=$!
          for attempt in {1..30}; do
            if curl --fail --silent "$BASE_URL/api/health" > /dev/null; then exit 0; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then cat vite.log; exit 1; fi
            sleep 1
          done
          cat vite.log
          exit 1
      - name: Run k6 load test
        run: k6 run --summary-export=reports/k6-load-summary.json --env BASE_URL="$(grep '^VITE_APP_URL=' .env.ci | cut -d= -f2-)" tests/performance/health.js
      - name: Upload load test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-reports
          path: |
            reports/k6-load-summary.json
            vite.log
          if-no-files-found: ignore

  cross-browser-tests:
    name: Cross-browser tests (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Prepare CI environment
        run: cp .env.ci.example .env.ci
      - run: npm ci
      - run: npx playwright install --with-deps firefox webkit
      - run: npx playwright test tests/e2e/currency-conversion.spec.js --project=firefox --project=webkit
      - name: Upload cross-browser reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-browser-reports
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  regenerate-visual-baselines:
    name: Regenerate Linux visual baselines (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.regenerate_visual_baselines
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Prepare CI environment
        run: cp .env.ci.example .env.ci
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:visual:update
      - name: Upload regenerated baselines for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-linux-visual-baselines
          path: tests/visual/visual-regression.spec.js-snapshots/*-linux.png
          if-no-files-found: error

  quality-gate:
    name: quality-gate
    if: always()
    runs-on: ubuntu-latest
    needs:
      - lint
      - compile
      - unit-tests
      - integration-tests
      - api-tests
      - functional-tests
      - accessibility-tests
      - security-tests
      - dependency-audit
      - secret-scan
      - codeql
      - dependency-review
    steps:
      - name: Require every blocking check to pass
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          COMPILE_RESULT: ${{ needs.compile.result }}
          UNIT_RESULT: ${{ needs.unit-tests.result }}
          INTEGRATION_RESULT: ${{ needs.integration-tests.result }}
          API_RESULT: ${{ needs.api-tests.result }}
          FUNCTIONAL_RESULT: ${{ needs.functional-tests.result }}
          ACCESSIBILITY_RESULT: ${{ needs.accessibility-tests.result }}
          SECURITY_RESULT: ${{ needs.security-tests.result }}
          AUDIT_RESULT: ${{ needs.dependency-audit.result }}
          SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          IS_PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
        run: |
          for result in "$LINT_RESULT" "$COMPILE_RESULT" "$UNIT_RESULT" "$INTEGRATION_RESULT" "$API_RESULT" "$FUNCTIONAL_RESULT" "$ACCESSIBILITY_RESULT" "$SECURITY_RESULT" "$AUDIT_RESULT" "$SECRET_SCAN_RESULT" "$CODEQL_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "A required quality check did not succeed: $result"
              exit 1
            fi
          done
          if [ "$IS_PULL_REQUEST" = "true" ] && [ "$DEPENDENCY_REVIEW_RESULT" != "success" ]; then
            echo "Dependency review did not succeed: $DEPENDENCY_REVIEW_RESULT"
            exit 1
          fi
          if [ "$IS_PULL_REQUEST" != "true" ] && [ "$DEPENDENCY_REVIEW_RESULT" != "skipped" ] && [ "$DEPENDENCY_REVIEW_RESULT" != "success" ]; then
            echo "Dependency review has an unexpected result: $DEPENDENCY_REVIEW_RESULT"
            exit 1
          fi
          echo "All required quality checks passed."
