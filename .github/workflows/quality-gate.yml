name: Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, master, develop, production]
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
    inputs:
      regenerate_visual_baselines:
        description: Regenerate Linux visual baselines and upload them as an artifact
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TEST_ENV: ci

jobs:
  lint:
    name: Lint (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  compile:
    name: Compile (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Prepare CI environment
        run: cp .env.ci.example .env.ci
      - run: npm ci
      - run: npm run build:ci
      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiled-app
          path: dist/
          if-no-files-found: ignore

  unit-tests:
    name: Unit tests (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run component tests
        run: |
          mkdir -p reports
          npx vitest run tests/components --reporter=junit --outputFile=reports/unit-tests.xml
      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: reports/unit-tests.xml
          if-no-files-found: ignore

  integration-tests:
    name: Functional and integration tests (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run integration tests
        run: |
          mkdir -p reports
          npx vitest run tests/integration --reporter=junit --outputFile=reports/integration-tests.xml
      - name: Upload integration test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-report
          path: reports/integration-tests.xml
          if-no-files-found: ignore

  api-tests:
    name: API contract tests (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Prepare CI environment
        run: cp .env.ci.example .env.ci
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run API tests
        run: npm run test:api
      - name: Upload API test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  functional-tests:
    name: Browser functional tests (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Prepare CI environment
        run: cp .env.ci.example .env.ci
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run functional tests
        run: npm run test:functional
      - name: Upload functional test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functional-test-reports
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  accessibility-tests:
    name: Accessibility tests (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Prepare CI environment
        run: cp .env.ci.example .env.ci
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run accessibility tests
        run: npm run test:accessibility
      - name: Upload accessibility reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-test-reports
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  security-tests:
    name: API input security tests (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Prepare CI environment
        run: cp .env.ci.example .env.ci
      - run: npm ci
      - name: Run API input validation security tests
        run: |
          npx playwright install --with-deps chromium
          npx playwright test tests/api --project=chrome --grep "rejects"
      - name: Upload security test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-test-reports
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  dependency-audit:
    name: Dependency audit (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit dependencies
        run: |
          mkdir -p reports
          npm audit --audit-level=high --json > reports/npm-audit.json
      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-report
          path: reports/npm-audit.json
          if-no-files-found: ignore

  performance-smoke:
    name: Performance smoke (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Prepare CI environment
        run: cp .env.ci.example .env.ci
      - run: npm ci
      - name: Setup k6
        uses: grafana/setup-k6-action@v1
      - name: Start local test service
        shell: bash
        run: |
          mkdir -p reports
          set -a
          source .env.ci
          set +a
          export BASE_URL="$VITE_APP_URL"
          npm run dev:ci > vite.log 2>&1 &
          server_pid=$!
          for attempt in {1..30}; do
            if curl --fail --silent "$BASE_URL/api/health" > /dev/null; then exit 0; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then cat vite.log; exit 1; fi
            sleep 1
          done
          cat vite.log
          exit 1
      - name: Run k6 smoke test
        run: k6 run --summary-export=reports/k6-smoke-summary.json --env BASE_URL="$(grep '^VITE_APP_URL=' .env.ci | cut -d= -f2-)" tests/performance/health-smoke.js
      - name: Upload performance smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-smoke-reports
          path: |
            reports/k6-smoke-summary.json
            vite.log
          if-no-files-found: ignore

  visual-regression:
    name: Visual regression (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Prepare CI environment
        run: cp .env.ci.example .env.ci
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run visual comparisons against committed Linux baselines
        run: npm run test:visual
      - name: Upload visual reports and diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-reports
          path: |
            playwright-report/
            test-results/
            tests/visual/visual-regression.spec.js-snapshots/
          if-no-files-found: ignore

  load-tests:
    name: Load tests (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Prepare CI environment
        run: cp .env.ci.example .env.ci
      - run: npm ci
      - name: Setup k6
        uses: grafana/setup-k6-action@v1
      - name: Start local test service
        shell: bash
        run: |
          mkdir -p reports
          set -a
          source .env.ci
          set +a
          export BASE_URL="$VITE_APP_URL"
          npm run dev:ci > vite.log 2>&1 &
          server_pid=$!
          for attempt in {1..30}; do
            if curl --fail --silent "$BASE_URL/api/health" > /dev/null; then exit 0; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then cat vite.log; exit 1; fi
            sleep 1
          done
          cat vite.log
          exit 1
      - name: Run k6 load test
        run: k6 run --summary-export=reports/k6-load-summary.json --env BASE_URL="$(grep '^VITE_APP_URL=' .env.ci | cut -d= -f2-)" tests/performance/health.js
      - name: Upload load test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-reports
          path: |
            reports/k6-load-summary.json
            vite.log
          if-no-files-found: ignore

  cross-browser-tests:
    name: Cross-browser tests (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Prepare CI environment
        run: cp .env.ci.example .env.ci
      - run: npm ci
      - name: Install Firefox and WebKit
        run: npx playwright install --with-deps firefox webkit
      - name: Run functional tests on Firefox and WebKit
        run: npx playwright test tests/e2e/currency-conversion.spec.js --project=firefox --project=webkit
      - name: Upload cross-browser reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-browser-reports
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  regenerate-visual-baselines:
    name: Regenerate Linux visual baselines (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.regenerate_visual_baselines
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Prepare CI environment
        run: cp .env.ci.example .env.ci
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Regenerate Linux snapshots
        run: npm run test:visual:update
      - name: Upload regenerated baselines for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-linux-visual-baselines
          path: tests/visual/visual-regression.spec.js-snapshots/*-linux.png
          if-no-files-found: error

  quality-gate:
    name: quality-gate
    if: always()
    runs-on: ubuntu-latest
    needs:
      - lint
      - compile
      - unit-tests
      - integration-tests
      - api-tests
      - functional-tests
      - accessibility-tests
      - security-tests
    steps:
      - name: Require every blocking check to pass
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          COMPILE_RESULT: ${{ needs.compile.result }}
          UNIT_RESULT: ${{ needs.unit-tests.result }}
          INTEGRATION_RESULT: ${{ needs.integration-tests.result }}
          API_RESULT: ${{ needs.api-tests.result }}
          FUNCTIONAL_RESULT: ${{ needs.functional-tests.result }}
          ACCESSIBILITY_RESULT: ${{ needs.accessibility-tests.result }}
          SECURITY_RESULT: ${{ needs.security-tests.result }}
        run: |
          for result in "$LINT_RESULT" "$COMPILE_RESULT" "$UNIT_RESULT" "$INTEGRATION_RESULT" "$API_RESULT" "$FUNCTIONAL_RESULT" "$ACCESSIBILITY_RESULT" "$SECURITY_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "A required quality check did not succeed: $result"
              exit 1
            fi
          done
          echo "All required quality checks passed."
