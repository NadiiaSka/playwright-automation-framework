name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  component-tests:
    name: Component tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run component tests
        run: npx vitest run tests/components --reporter=default

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: npx vitest run tests/integration --reporter=default

  playwright:
    name: Playwright E2E tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Prepare CI environment
        run: cp .env.ci.example .env.ci

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build:ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test tests/e2e --project=chrome --reporter=line
      - name: Run Playwright visual tests
        run: npx playwright test tests/visual --project=chrome --reporter=line

      - name: Upload Playwright screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  performance:
    name: k6 performance tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Prepare CI environment
        run: cp .env.ci.example .env.ci

      - name: Install dependencies
        run: npm ci

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Start CI server
        shell: bash
        run: |
          set -a
          source .env.ci
          set +a
          export BASE_URL="$VITE_APP_URL"
          npm run dev:ci > vite.log 2>&1 &
          server_pid=$!
          for attempt in {1..30}; do
            if curl --fail --silent "$BASE_URL/api/health" > /dev/null; then
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "Vite exited before the health endpoint became available."
              cat vite.log
              exit 1
            fi
            sleep 1
          done
          echo "Vite did not become ready within 30 seconds."
          cat vite.log
          exit 1

      - name: Run k6 health load test
        run: k6 run --env BASE_URL="$(grep '^VITE_APP_URL=' .env.ci | cut -d= -f2-)" tests/performance/health.js

      - name: Upload Vite log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: performance-vite-log
          path: vite.log
          if-no-files-found: ignore
